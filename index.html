<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>compixel1k Studio</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f1c2c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="compixel1k">
<style>
:root{color-scheme:dark;--bg:#14121c;--p:#1f1c2c;--p2:#2a2640;--ac:#7c5cff;--tx:#eee;--mu:#9a96b5;--bd:#3a3558}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;user-select:none}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0 8px 0 0;color:#b9a6ff}
button,select,input{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.on{background:var(--ac);border-color:var(--ac)}
button.off{opacity:.45}
input[type=number]{width:58px}input[type=range]{padding:0}
#name{width:170px}
#net{margin-left:auto;font-size:12px;padding:4px 8px;border-radius:10px;background:#1d4d2b}
#net.no{background:#6b2230}
#banner{display:none;background:#6b2230;padding:8px 12px;text-align:center}
main{display:flex;flex-wrap:wrap;gap:12px;padding:12px;justify-content:center;align-items:flex-start}
.panel{background:var(--p);border:1px solid var(--bd);border-radius:10px;padding:10px}
#tools{display:flex;flex-direction:column;gap:6px;min-width:96px}
#stage{background:#0c0b12;padding:8px;max-width:100%;overflow:auto}
canvas{display:block;image-rendering:pixelated}
#cv{touch-action:none;cursor:crosshair}
#side{width:220px;max-width:100%}
.sec{margin:0 0 6px;color:var(--mu);font-size:12px;text-transform:uppercase}
#pal{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:6px 0 10px}
#pal div{aspect-ratio:1;border:1px solid #0006;border-radius:3px;cursor:pointer}
#pal div.sel{outline:2px solid #fff}
#wheel{border-radius:50%;cursor:crosshair;margin:4px auto;touch-action:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
#cur{width:34px;height:34px;border-radius:6px;border:2px solid #fff}
#tl{width:100%;max-width:1100px}
#strip{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.fr{flex:none;text-align:center;font-size:11px;color:var(--mu);cursor:pointer;padding:4px;border:2px solid transparent;border-radius:6px}
.fr.sel{border-color:var(--ac);color:#fff}
.fr canvas{background:#fff2}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}
#mb{background:var(--p);border:1px solid var(--ac);border-radius:12px;padding:18px;max-width:420px;width:100%}
#mb .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ac);padding:8px 16px;border-radius:20px;display:none;z-index:10}
.pl{display:flex;gap:6px;align-items:center;justify-content:space-between;margin:6px 0}
#fside{position:fixed;top:0;right:0;height:100%;width:min(320px,90vw);background:var(--p);border-left:1px solid var(--ac);padding:12px;transform:translateX(100%);transition:transform .2s;z-index:8;overflow:auto}
#fside.open{transform:none}
#cv{max-width:100%;height:auto}body{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media(max-width:760px){
header{padding:6px 8px;gap:6px}h1{font-size:15px;width:100%;margin:0}
#name{flex:1;min-width:110px;width:auto}header button{padding:6px 8px}#net{margin-left:0}
main{padding:8px;gap:8px}
#tools{flex-direction:row;flex-wrap:wrap;width:100%;min-width:0;align-items:center}
#tools .sec{width:100%;margin:0}#tools button{flex:1 1 auto}
#stage{width:100%;padding:4px;display:flex;justify-content:center}
#side{width:100%}#pal{grid-template-columns:repeat(16,1fr)}#tl{padding:8px}
#fps{width:90px}
}
#load{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#load .lg{font-size:56px}.bar{width:min(320px,80vw);height:10px;background:var(--p2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
</style></head><body>
<header>
<h1 id="logo"></h1>
<input id="name" value="Untitled" maxlength="40" title="Project name">
<button id="bMenu">🏠 Menu</button><button id="bNew">New</button><button id="bSave">Save</button><button id="bOpen">Open</button><button id="bExp">Export</button><button id="bTpl">🎨 Templates</button><button id="bFold" style="display:none">📁</button><button id="bInst">⬇ Download app</button>
<span id="net">Online</span>
</header>
<div id="banner"></div>
<main>
<div id="tools" class="panel">
<div class="sec">Tools</div>
<button data-t="draw">✏️ Draw (B)</button><button data-t="erase">🧽 Eraser (E)</button>
<button data-t="fill">🪣 Fill (G)</button><button data-t="pick">💧 Picker (I)</button>
<div class="row">Size <select id="size"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<button id="bUndo">↶ Undo</button><button id="bRedo">↷ Redo</button>
<div class="sec" style="margin-top:8px">Grid</div>
<button id="bGrid" class="on">Grid: On</button>
<div class="row"><input id="gw" type="number" min="4" max="128" value="16"><span>×</span><input id="gh" type="number" min="4" max="128" value="16"></div>
<button id="bApply">Set grid size</button>
<button id="bClear">Clear frame</button>
</div>
<div id="stage" class="panel"><canvas id="cv"></canvas></div>
<div id="side" class="panel">
<div class="sec">Color</div>
<div class="row"><div id="cur"></div><input id="hex" value="#ffffff" size="8"></div>
<canvas id="wheel" width="140" height="140"></canvas>
<div class="row">Brightness <input id="val" type="range" min="0" max="100" value="100" style="flex:1"></div>
<div class="sec">Palette</div><div id="pal"></div>
</div>
<div id="tl" class="panel">
<div class="row">
<button id="bPlay">▶ Play</button>
<span>FPS</span><input id="fps" type="range" min="1" max="24" value="8"><b id="fpsv">8</b>
<button id="bOnion" class="on">Onion skin</button>
<button id="bAdd">+ Frame</button><button id="bDup">Duplicate</button><button id="bDel">Delete</button>
<button id="bL">←</button><button id="bR">→</button>
<span id="info" style="margin-left:auto;color:var(--mu)"></span>
</div>
<div id="strip"></div>
</div>
</main>
<aside id="fside"><div class="row"><b>📁 Exports</b><button id="fclose" style="margin-left:auto">✕</button></div><div id="flist"></div></aside>
<div id="load"><div class="lg">🎞️</div><h2 id="lt" style="margin:0"></h2><div class="bar"><i id="lb"></i></div><p id="ls" style="color:var(--mu);margin:0">Starting…</p></div>
<div id="md"><div id="mb"></div></div><div id="toast"></div>
<script>
const STUDIO='compixel1k Studio',$=id=>document.getElementById(id);
$('logo').textContent='🎞️ '+STUDIO;
const UA=navigator.userAgent,CROS=/CrOS/.test(UA),MOB=!CROS&&(/Android|iPhone|iPad|iPod/i.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1)),esc=t=>t.replace(/</g,'&lt;');
if(MOB)$('bFold').style.display='';
let W=16,H=16,frames=[],cur=0,color='#ffffff',tool='draw',fps=8,onion=true,grid=true,dirty=false,pid=null,hist=[],redo=[],play=null,hsv={h:0,s:0,v:1};
const blank=()=>new Array(W*H).fill('');frames=[blank()];
const online=()=>navigator.onLine,cv=$('cv'),ctx=cv.getContext('2d');
let C=16;
const PAL='#000000 #1d2b53 #7e2553 #008751 #ab5236 #5f574f #c2c3c7 #fff1e8 #ff004d #ffa300 #ffec27 #00e436 #29adff #83769c #ff77a8 #ffccaa #ffffff #291814 #111d35 #422136 #125359 #742f29 #49333b #a28879 #be1250 #ff6c24 #a8e72e #00b543 #065ab5 #754665 #ff6e59 #ff9d81'.split(' ');
// ---------- modal / toast
function modal(html,btns,wide){const m=$('mb');m.style.maxWidth=wide?'680px':'';m.style.maxHeight=wide?'85vh':'';m.style.overflow=wide?'auto':'';m.innerHTML=html+'<div class="btns"></div>';btns.forEach(([t,fn,cls])=>{const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=()=>{$('md').style.display='none';fn&&fn()};m.lastChild.appendChild(b)});$('md').style.display='flex'}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
const pname=()=>$('name').value.trim()||'Untitled';
const offMsg=()=>`You are currently running ${STUDIO} without wifi. Please save the project before exiting`;
function netUI(){const o=online();$('net').textContent=o?'Online':'Offline';$('net').className=o?'':'no';$('banner').style.display=o?'none':'block';$('banner').textContent=offMsg();
 ['bSave','bNew','bExp'].forEach(i=>$(i).classList.toggle('off',!o));if(CROS)$('bExp').classList.add('off')}
addEventListener('online',netUI);addEventListener('offline',netUI);
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
// ---------- render
function fit(){const aw=Math.min(640,document.documentElement.clientWidth-(innerWidth<760?28:60));C=Math.max(2,Math.floor(aw/Math.max(W,H)))}
addEventListener('resize',()=>{if(!play)all()});
function drawF(x,f,c,a=1){x.globalAlpha=a;for(let i=0;i<f.length;i++)if(f[i]){x.fillStyle=f[i];x.fillRect((i%W)*c,((i/W)|0)*c,c,c)}x.globalAlpha=1}
function render(){fit();cv.width=W*C;cv.height=H*C;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=(x+y)%2?'#2b2840':'#35314d';ctx.fillRect(x*C,y*C,C,C)}
 if(onion&&cur>0&&!play)drawF(ctx,frames[cur-1],C,.3);
 drawF(ctx,frames[cur],C);
 if(grid){ctx.strokeStyle='rgba(160,150,200,.35)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x++){ctx.moveTo(x*C+.5,0);ctx.lineTo(x*C+.5,H*C)}
  for(let y=0;y<=H;y++){ctx.moveTo(0,y*C+.5);ctx.lineTo(W*C,y*C+.5)}ctx.stroke()}
 $('info').textContent=`${W}×${H} · Frame ${cur+1}/${frames.length}${dirty?' · unsaved ●':''}`}
function thumbs(){const s=$('strip');s.innerHTML='';const t=Math.max(1,Math.floor(56/Math.max(W,H)));
 frames.forEach((f,i)=>{const d=document.createElement('div');d.className='fr'+(i==cur?' sel':'');
  const c=document.createElement('canvas');c.width=W*t;c.height=H*t;drawF(c.getContext('2d'),f,t);
  d.append(c,i+1);d.onclick=()=>{cur=i;all()};s.appendChild(d)})}
function all(){render();thumbs()}
// ---------- history
const state=()=>JSON.stringify([W,H,frames]);
function snap(){hist.push(state());if(hist.length>60)hist.shift();redo=[];dirty=true}
function restore(s){[W,H,frames]=JSON.parse(s);cur=Math.min(cur,frames.length-1);$('gw').value=W;$('gh').value=H;all()}
$('bUndo').onclick=()=>{if(hist.length){redo.push(state());restore(hist.pop())}};
$('bRedo').onclick=()=>{if(redo.length){hist.push(state());restore(redo.pop())}};
// ---------- drawing
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t))}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
function setColor(c){color=c;$('cur').style.background=c;$('hex').value=c;
 if(tool=='erase')setTool('draw'); // picking a color leaves eraser
 document.querySelectorAll('#pal div').forEach(d=>d.classList.toggle('sel',d.dataset.c==c))}
const cell=e=>{const r=cv.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H)]};
function paint([x,y]){const n=+$('size').value,f=frames[cur],v=tool=='erase'?'':color;
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){const a=x+i,b=y+j;if(a>=0&&b>=0&&a<W&&b<H)f[b*W+a]=v}}
function line(a,b){let[x0,y0]=a,[x1,y1]=b,dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;
 for(;;){paint([x0,y0]);if(x0==x1&&y0==y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function flood([x,y]){if(x<0||y<0||x>=W||y>=H)return;const f=frames[cur],t=f[y*W+x],v=tool=='erase'?'':color;if(t===v)return;
 const s=[[x,y]];while(s.length){const[a,b]=s.pop();if(a<0||b<0||a>=W||b>=H||f[b*W+a]!==t)continue;f[b*W+a]=v;s.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}}
let down=false,last;
cv.onpointerdown=e=>{if(play)return;const p=cell(e);
 if(tool=='pick'){const c=frames[cur][p[1]*W+p[0]];if(c)setColor(c);setTool('draw');return}
 snap();if(tool=='fill'){flood(p);all();return}
 cv.setPointerCapture(e.pointerId);down=true;last=p;paint(p);render()};
cv.onpointermove=e=>{if(!down)return;const p=cell(e);line(last,p);last=p;render()};
cv.onpointerup=()=>{if(down){down=false;all()}};
// ---------- color wheel
const wh=$('wheel'),wx=wh.getContext('2d');
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5),f(3),f(1)].map(x=>Math.round(x*255))}
const hex=r=>'#'+r.map(x=>x.toString(16).padStart(2,'0')).join('');
function drawWheel(){const im=wx.createImageData(140,140);
 for(let y=0;y<140;y++)for(let x=0;x<140;x++){const dx=x-70,dy=y-70,d=Math.hypot(dx,dy);if(d>70)continue;
  const[r,g,b]=hsv2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,d/70,hsv.v),i=(y*140+x)*4;im.data.set([r,g,b,255],i)}
 wx.putImageData(im,0,0)}
function wheelPick(e){const r=wh.getBoundingClientRect(),dx=e.clientX-r.left-70,dy=e.clientY-r.top-70,d=Math.min(70,Math.hypot(dx,dy));
 hsv.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;hsv.s=d/70;setColor(hex(hsv2rgb(hsv.h,hsv.s,hsv.v)))}
let wd=false;wh.onpointerdown=e=>{wd=true;wh.setPointerCapture(e.pointerId);wheelPick(e)};wh.onpointermove=e=>wd&&wheelPick(e);wh.onpointerup=()=>wd=false;
$('val').oninput=e=>{hsv.v=e.target.value/100;drawWheel();setColor(hex(hsv2rgb(hsv.h,hsv.s,hsv.v)))};
$('hex').onchange=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value))setColor(e.target.value.toLowerCase());else e.target.value=color};
PAL.forEach(c=>{const d=document.createElement('div');d.style.background=c;d.dataset.c=c;d.onclick=()=>setColor(c);$('pal').appendChild(d)});
// ---------- frames
const mk=()=>{snap();all()};
$('bAdd').onclick=()=>{snap();frames.splice(cur+1,0,blank());cur++;all()};
$('bDup').onclick=()=>{snap();frames.splice(cur+1,0,[...frames[cur]]);cur++;all()};
$('bDel').onclick=()=>{if(frames.length<2)return toast('Need at least one frame');snap();frames.splice(cur,1);cur=Math.min(cur,frames.length-1);all()};
$('bL').onclick=()=>{if(cur>0){snap();[frames[cur-1],frames[cur]]=[frames[cur],frames[cur-1]];cur--;all()}};
$('bR').onclick=()=>{if(cur<frames.length-1){snap();[frames[cur+1],frames[cur]]=[frames[cur],frames[cur+1]];cur++;all()}};
$('bClear').onclick=()=>{snap();frames[cur]=blank();all()};
$('fps').oninput=e=>{fps=+e.target.value;$('fpsv').textContent=fps;dirty=true};
$('bOnion').onclick=e=>{onion=!onion;e.target.classList.toggle('on',onion);render()};
$('bGrid').onclick=e=>{grid=!grid;e.target.classList.toggle('on',grid);e.target.textContent='Grid: '+(grid?'On':'Off');render()};
$('bApply').onclick=()=>{const w=Math.max(4,Math.min(128,+$('gw').value||16)),h=Math.max(4,Math.min(128,+$('gh').value||16));
 snap();frames=frames.map(f=>{const n=new Array(w*h).fill('');for(let y=0;y<Math.min(h,H);y++)for(let x=0;x<Math.min(w,W);x++)n[y*w+x]=f[y*W+x];return n});W=w;H=h;all()};
function tick(){cur=(cur+1)%frames.length;render();document.querySelectorAll('.fr').forEach((d,i)=>d.classList.toggle('sel',i==cur));play=setTimeout(tick,1000/fps)}
function togglePlay(){if(play){clearTimeout(play);play=null;$('bPlay').textContent='▶ Play';all()}else{$('bPlay').textContent='⏸ Pause';play=setTimeout(tick,1000/fps)}}
$('bPlay').onclick=togglePlay;
// ---------- projects
const DB='pixelflip_projects';
const getDB=()=>{try{return JSON.parse(localStorage.getItem(DB)||'{}')}catch(e){return{}}};
function doSave(){pid=pid||'p'+Date.now();const d=getDB();d[pid]={name:pname(),W,H,fps,frames,t:Date.now()};
 try{localStorage.setItem(DB,JSON.stringify(d));dirty=false;render();toast('Project saved')}catch(e){toast('Could not save (storage unavailable)')}}
function save(after){if(!online())return modal(`<h3>Can't save</h3><p>${offMsg()}</p>`,[['OK']]);doSave();after&&after()}
$('bSave').onclick=()=>save();
function fresh(){W=+$('gw').value||16;H=+$('gh').value||16;frames=[blank()];cur=0;hist=[];redo=[];pid=null;dirty=false;$('name').value='Untitled';all()}
$('bNew').onclick=()=>{
 if(!online())return modal(`<h3>New project</h3><p>Are you sure you want to start a new project? Your animation has not been saved due to you not having Internet connection. Save before creating a new project.</p>`,[['Skip',fresh],['Cancel']]);
 if(!dirty)return fresh();
 modal(`<h3>New project</h3><p>You have unsaved changes. Save before starting a new project?</p>`,[['Save & new',()=>save(fresh)],['Skip',fresh],['Cancel']])};
$('bOpen').onclick=()=>{const d=getDB(),ids=Object.keys(d).sort((a,b)=>d[b].t-d[a].t);
 modal(`<h3>Saved projects</h3>`+(ids.length?ids.map(i=>`<div class="pl"><span>${d[i].name.replace(/</g,'&lt;')} <small style="color:var(--mu)">${d[i].W}×${d[i].H} · ${d[i].frames.length}f</small></span><span><button data-o="${i}">Open</button> <button data-x="${i}">🗑</button></span></div>`).join(''):'<p>No saved projects yet.</p>'),[['Close']]);
 $('mb').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const p=d[b.dataset.o];W=p.W;H=p.H;frames=p.frames;fps=p.fps;pid=b.dataset.o;cur=0;hist=[];redo=[];dirty=false;
  $('name').value=p.name;$('fps').value=fps;$('fpsv').textContent=fps;$('gw').value=W;$('gh').value=H;$('md').style.display='none';all()});
 $('mb').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{delete d[b.dataset.x];localStorage.setItem(DB,JSON.stringify(d));if(pid==b.dataset.x)pid=null;$('bOpen').click()})};
// ---------- export
function dl(href,fn){const a=document.createElement('a');a.href=href;a.download=fn;a.click()}
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('c1k',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,fn)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=no})};
const putF=r=>tx('readwrite',s=>s.put(r)),allF=()=>tx('readonly',s=>s.getAll()),delF=id=>tx('readwrite',s=>s.delete(id));
async function fold(open){let l=[];try{l=(await allF()).sort((a,b)=>b.t-a.t)}catch(e){}
 $('flist').innerHTML=l.length?l.map(r=>`<div class="pl"><span style="word-break:break-all">${esc(r.name)}<br><small style="color:var(--mu)">${(r.blob.size/1024).toFixed(0)} KB</small></span><span><button data-d="${r.id}">⬇ Download</button> <button data-r="${r.id}">🗑</button></span></div>`).join(''):'<p style="color:var(--mu)">No exports yet.</p>';
 $('flist').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const r=l.find(x=>x.id==b.dataset.d);dl(URL.createObjectURL(r.blob),r.name)});
 $('flist').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await delF(b.dataset.r);fold()});
 if(open)$('fside').classList.add('open')}
$('bFold').onclick=()=>fold(true);$('fclose').onclick=()=>$('fside').classList.remove('open');
const sc=()=>Math.max(2,Math.ceil(256/Math.max(W,H)));
async function makeSheet(){const s=sc(),c=document.createElement('canvas'),x=c.getContext('2d');c.width=W*s*frames.length;c.height=H*s;
 frames.forEach((f,i)=>{x.save();x.translate(i*W*s,0);drawF(x,f,s);x.restore()});return new Promise(r=>c.toBlob(r,'image/png'))}
async function makeMP4(){const s=sc(),c=document.createElement('canvas'),x=c.getContext('2d');c.width=W*s;c.height=H*s;
 const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mt)throw 0;
 const st=c.captureStream(),tr=st.getVideoTracks()[0],rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:4e6}),ch=[],done=new Promise(r=>rec.onstop=r);
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const draw=i=>{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);drawF(x,frames[i],s);tr.requestFrame&&tr.requestFrame()};
 draw(0);rec.start();const loops=Math.max(1,Math.ceil(2000/(frames.length*1000/fps)));
 for(let l=0;l<loops;l++)for(let i=0;i<frames.length;i++){draw(i);await new Promise(r=>setTimeout(r,1000/fps))}
 rec.stop();await done;return new Blob(ch,{type:mt.split(';')[0]})}
async function doExport(kind){let dir=null;
 if(!MOB&&window.showDirectoryPicker){try{const d=await showDirectoryPicker({id:'c1kdocs',mode:'readwrite',startIn:'documents'});dir=await d.getDirectoryHandle('pixel animation',{create:true})}catch(e){return toast('Export cancelled')}}
 toast('Exporting…');
 try{const blob=kind=='mp4'?await makeMP4():await makeSheet(),ext={'video/mp4':'mp4','video/webm':'webm','image/png':'png'}[blob.type],
  fn=pname().replace(/[\\/:*?"<>|]/g,'_')+(kind=='sheet'?'-spritesheet':'')+'.'+ext;
  if(dir){const w=await(await dir.getFileHandle(fn,{create:true})).createWritable();await w.write(blob);await w.close();toast('Saved to Documents › pixel animation')}
  else if(MOB){await putF({id:'f'+Date.now(),name:fn,type:blob.type,blob,t:Date.now()});toast('Exported! Tap 📁 to download');fold(true)}
  else{dl(URL.createObjectURL(blob),fn);toast('Exported')}
  if(ext=='webm')setTimeout(()=>toast('MP4 not supported by this browser — saved as WebM'),2000)
 }catch(e){toast('Export failed')}}
function askExp(k){if(MOB)return doExport(k);
 modal(`<h3>Permission needed</h3><p>We need permission from you to export this</p><p style="color:var(--mu)">Pick your Documents folder when asked. Files go into a new "pixel animation" folder there.</p>`,[['Confirm',()=>doExport(k)],['Denied',()=>toast('Export denied')]])}

const O=(f,cx,cy,rx,ry,c)=>{rx=Math.max(.5,rx);ry=Math.max(.5,ry);for(let y=-Math.ceil(ry);y<=ry;y++)for(let x=-Math.ceil(rx);x<=rx;x++)if(x*x/(rx*rx)+y*y/(ry*ry)<=1)P(f,cx+x,cy+y,c)};
const TP=[
['Bouncing Ball',8,10,(f,i,n)=>{R(f,0,28,32,4,'#5f574f');const h=Math.abs(Math.sin(i/n*Math.PI)),y=Math.round(26-h*18),q=h<.15?2:0;O(f,16,29,7-h*4,1,'#291814');O(f,16,y,5+q,5-q,'#ff004d');P(f,14,y-2,'#fff1e8')}],
['Pulse Heart',8,10,(f,i,n)=>{const s=11+Math.sin(i/n*Math.PI*2)*2;for(let y=0;y<32;y++)for(let x=0;x<32;x++){const a=(x-16)/s,b=-(y-15)/s;if(Math.pow(a*a+b*b-1,3)-a*a*b*b*b<=0)P(f,x,y,'#ff004d')}P(f,11,10,'#ff77a8')}],
['Spinning Coin',8,10,(f,i,n)=>{const w=Math.max(1,Math.round(Math.abs(Math.cos(i/n*Math.PI))*10));O(f,16,16,w,10,'#ffa300');O(f,16,16,w-2,8,'#ffec27');if(w>4)R(f,15,11,2,10,'#ffa300')}],
['Campfire',6,8,(f,i)=>{const j=Math.sin(i*1.05)*2,k=Math.cos(i*2.1)*2;R(f,6,28,20,3,'#742f29');O(f,16,22,8,7,'#ff004d');O(f,16,Math.round(19+k/2),6+j/2,10+k,'#ff6c24');O(f,16,23,4,6+j,'#ffec27')}],
['Rainy Cloud',8,10,(f,i)=>{O(f,10,7,7,4,'#83769c');O(f,19,6,8,5,'#83769c');O(f,24,9,5,3,'#83769c');R(f,6,9,24,2,'#83769c');for(let k=0;k<10;k++)R(f,(k*7+3)%30+1,12+(k*5+i*2)%16,1,3,'#29adff')}],
['Chomper',6,10,(f,i)=>{const m=Math.abs(Math.sin(i/6*Math.PI))*.7;for(let y=-10;y<=10;y++)for(let x=-10;x<=10;x++)if(x*x+y*y<=100&&Math.abs(Math.atan2(y,x))>m)P(f,12+x,16+y,'#ffec27');P(f,14,10,'#111d35');for(let k=0;k<3;k++){const x=30-((k*8+i*4)%24);if(x>23)R(f,x,15,2,2,'#fff1e8')}}],
['Sunny Day',8,10,(f,i)=>{f.fill('#29adff');O(f,16,16,7,7,'#ffa300');O(f,16,16,5,5,'#ffec27');for(let k=0;k<8;k++){const a=k*Math.PI/4+i*Math.PI/32;for(let d=10;d<=14;d++)P(f,16+Math.cos(a)*d,16+Math.sin(a)*d,'#ffa300')}}],
['Twinkle Stars',8,6,(f,i)=>{f.fill('#111d35');for(let k=0;k<12;k++){const x=(k*13+5)%30+1,y=(k*7+3)%28+2,b=Math.sin((i/8+k/12)*Math.PI*2);P(f,x,y,b>.3?'#fff1e8':b>-.3?'#83769c':'#1d2b53');if(b>.8){P(f,x+1,y,'#fff1e8');P(f,x-1,y,'#fff1e8');P(f,x,y+1,'#fff1e8');P(f,x,y-1,'#fff1e8')}}}],
['Loading Spinner',8,12,(f,i)=>{for(let k=0;k<8;k++){const a=k*Math.PI/4,d=(i-k+8)%8;O(f,16+Math.cos(a)*10,16+Math.sin(a)*10,2,2,['#ffffff','#c2c3c7','#83769c','#5f574f','#3a3558','#3a3558','#3a3558','#3a3558'][d])}}],
['Swimming Fish',8,8,(f,i)=>{f.fill('#065ab5');const x=((i*5)%40)-8,w=i%2?1:-1;O(f,x,16,6,4,'#ffa300');R(f,x-10,13+w,4,6,'#ff6c24');R(f,x-6,15,2,2,'#ff6c24');P(f,x+3,15,'#111d35');for(let k=0;k<3;k++)P(f,(k*11+6)%30,28-((i*3+k*8)%24),'#c2c3c7')}],
['Jelly Slime',8,10,(f,i)=>{R(f,0,28,32,4,'#00b543');const s=Math.sin(i/8*Math.PI*2),hh=8+s*2,ww=10-s*2,cy=Math.round(27-hh-Math.max(0,s)*6);O(f,16,29,ww,1,'#125359');O(f,16,cy,ww,hh,'#00e436');P(f,12,cy-1,'#111d35');P(f,20,cy-1,'#111d35');P(f,11,cy-4,'#a8e72e')}],
['Snowfall',8,8,(f,i)=>{f.fill('#1d2b53');R(f,0,30,32,2,'#fff1e8');for(let k=0;k<14;k++)P(f,(k*9+4+Math.round(Math.sin((i+k)/8*Math.PI*2)))%32,(k*5+i*4)%32,'#fff1e8')}],
['Heartbeat',16,16,(f,i)=>{f.fill('#111d35');let p=16;for(let x=0;x<32;x++){const u=(x+i*2)%32,y={10:15,11:14,12:15,14:5,15:26,16:17}[u]||16;for(let t=Math.min(p,y);t<=Math.max(p,y);t++)P(f,x,t,'#00e436');p=y}}],
['Walk Cycle',8,10,(f,i)=>{const a=Math.sin(i/8*Math.PI*2)*.7,L=(x,y,l,t,c)=>{for(let d=0;d<=l;d++)P(f,x+Math.sin(t)*d,y+Math.cos(t)*d,c)};R(f,0,29,32,3,'#5f574f');L(16,19,10,-a,'#7e2553');L(16,11,7,a,'#ffccaa');O(f,16,6,3,3,'#ffccaa');L(16,10,9,0,'#29adff');L(16,19,10,a,'#ff004d');L(16,11,7,-a,'#ffccaa')}],
['Fireworks',12,10,(f,i)=>{f.fill('#111d35');const r=i*1.3,c=i<6?'#ffec27':i<9?'#ffa300':'#ff004d';for(let k=0;k<12;k++){const a=k*Math.PI/6;P(f,16+Math.cos(a)*r,14+Math.sin(a)*r,c);P(f,16+Math.cos(a+.26)*r*.6,14+Math.sin(a+.26)*r*.6,k%2?'#29adff':'#fff1e8')}if(i<2)R(f,16,20+i*-4+8,1,4,'#fff1e8')}],
['Blinking Eye',8,8,(f,i)=>{const o=[8,8,8,7,3,0,3,7][i];if(!o)return R(f,3,16,26,1,'#111d35');O(f,16,16,13,o,'#fff1e8');const q=Math.min(5,o);O(f,16,16,q,q,'#29adff');O(f,16,16,Math.min(2,o),Math.min(2,o),'#111d35')}]

function build(t){const ow=W,oh=H;W=H=32;const fr=[];for(let i=0;i<t[1];i++){const f=new Array(1024).fill('');t[3](f,i,t[1]);fr.push(f)}W=ow;H=oh;return fr}
$('bTpl').onclick=()=>{const T=TP.map(t=>({n:t[0],fps:t[2],fr:build(t)}));
 modal('<h3>Templates</h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">'+T.map((t,i)=>`<div class="pl" style="flex-direction:column;background:var(--p2);padding:8px;border-radius:8px"><canvas width="96" height="96" data-i="${i}" style="background:#fff2"></canvas><b>${t.n}</b><small style="color:var(--mu)">${t.fr.length} frames · ${t.fps} fps</small><button data-u="${i}">Use</button></div>`).join('')+'</div>',[['Close']],true);
 let k=0;const cs=[...$('mb').querySelectorAll('canvas')],draw=()=>{const o=W;W=32;cs.forEach(c=>{const x=c.getContext('2d'),t=T[c.dataset.i];x.clearRect(0,0,96,96);drawF(x,t.fr[k%t.fr.length],3)});W=o};
 draw();const iv=setInterval(()=>{if($('md').style.display=='none')return clearInterval(iv);k++;draw()},130);
 $('mb').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const t=T[b.dataset.u],go=()=>{W=H=32;frames=t.fr;fps=t.fps;cur=0;hist=[];redo=[];pid=null;dirty=true;$('name').value=t.n;$('fps').value=fps;$('fpsv').textContent=fps;$('gw').value=32;$('gh').value=32;$('md').style.display='none';all()};
  dirty?modal('<h3>Load template?</h3><p>Your current project has unsaved changes.</p>',[['Load anyway',go],['Cancel']]):go()})};
// ---------- keys
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(e.ctrlKey||e.metaKey){if(k=='z'){e.preventDefault();$(e.shiftKey?'bRedo':'bUndo').click()}else if(k=='y'){e.preventDefault();$('bRedo').click()}else if(k=='s'){e.preventDefault();save()}return}
 ({b:()=>setTool('draw'),e:()=>setTool('erase'),g:()=>setTool('fill'),i:()=>setTool('pick'),' ':()=>{e.preventDefault();togglePlay()},arrowleft:()=>{if(cur>0){cur--;all()}},arrowright:()=>{if(cur<frames.length-1){cur++;all()}}})[k]?.()});

// ---------- start menu
function menu(){
 modal(`<h2 style="margin:0 0 4px">🎞️ ${STUDIO}</h2><p style="color:var(--mu);margin:0 0 12px">Pixel animation studio</p>
 <div class="row">Name <input id="mn" value="Untitled" maxlength="40" style="flex:1;min-width:0"></div>
 <div class="row">Grid size <input id="mw" type="number" min="4" max="128" value="16"> × <input id="mh" type="number" min="4" max="128" value="16"></div>`,
 [['Open saved',()=>$('bOpen').click()],['Templates',()=>$('bTpl').click()],['Create project',()=>{
  const c=v=>Math.max(4,Math.min(128,+v||16)),w=c($('mw').value),h=c($('mh').value),n=$('mn').value.trim()||'Untitled',

// ---------- app install (PWA) + loading screen
const SW='serviceWorker' in navigator&&/^https?:/.test(location.protocol),sleep=t=>new Promise(r=>setTimeout(r,t)),
STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,
PLAT=CROS?'chromeos':(/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1))?'ios':/Android/.test(UA)?'android':/Mac/.test(UA)?'mac':'win',
PN={win:'Windows PC',mac:'Mac',android:'Android phone / tablet',ios:'iPhone / iPad'};
let DP=null;
if(SW)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});
addEventListener('appinstalled',()=>{DP=null;toast('App installed!')});
if(STANDALONE){$('bInst').style.display='none';
 if(MOB)addEventListener('pointerdown',()=>{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{})},{once:true})}
async function boot(force){if(!force&&!STANDALONE)return;
 $('load').style.display='flex';$('lt').textContent=STUDIO;
 const step=async(t,p,fn)=>{$('ls').textContent=t;$('lb').style.width=p+'%';try{await fn()}catch(e){}await sleep(250)};
 await step('Registering app files…',10,async()=>{if(SW)await navigator.serviceWorker.ready});
 await step('Downloading assets…',35,async()=>{const c=await caches.open('c1k-v1');await Promise.all(['./','index.html','manifest.webmanifest','icon-192.png','icon-512.png'].map(a=>c.add(a)))});
 await step('Securing saved data…',60,async()=>{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()});
 await step(`Loading saved projects (${Object.keys(getDB()).length})…`,80,()=>allF());
 await step('Preparing templates…',95,()=>TP.forEach(build));
 $('lb').style.width='100%';$('ls').textContent='Ready!';await sleep(350);$('load').style.display='none'}
$('bInst').onclick=()=>{
 if(CROS)return modal("<h3>Not supported</h3><p>ChromeOS isn't supported for this studio.</p>",[['ok']]);
 modal(`<h3>Download app</h3><p>Do you want to download this as an app?</p><div class="row">For <select id="ip">${Object.keys(PN).map(k=>`<option value="${k}"${k==PLAT?' selected':''}>${PN[k]}</option>`).join('')}</select></div><p style="color:var(--mu)">The app opens on its own — no address bar. Windowed on PC, fullscreen on mobile.</p>`,[['No'],['Yes',()=>askInst($('ip').value),'on']])};
function askInst(p){
 if(p!=PLAT)return modal(`<h3>Open it on that device</h3><p>Open this studio on your ${PN[p]} and press <b>Download app</b> there.</p>`,[['ok']]);
 if(MOB)return modal('<h3>Permission needed</h3><p>We need your permission to download the app version.</p>',[['Confirm',inst],['Denied',()=>toast('Download denied')]]);

async function inst(){
 if(DP){const d=DP;DP=null;d.prompt();const r=await d.userChoice;if(r.outcome=='accepted')await boot(true);else toast('Install cancelled');return}

 if(PLAT=='mac'&&!/Chrome|Edg/.test(UA))return modal('<h3>Add to Dock</h3><p>In Safari choose <b>File → Add to Dock</b>.</p>',[['ok']]);
 const b=[['ok']],file=decodeURIComponent(location.pathname.split('/').pop())||'index.html';

 modal(`<h3>Can't install from here</h3><p>The installable app needs the hosted (https) version of this studio, or the browser has already installed it.</p>${b.length>1?'<p>Meanwhile, put the launcher in the same folder as this HTML file and double-click it. It opens the studio in its own window with no address bar.</p>':''}`,b)}
const start=()=>CROS?modal("<h3>⚠️ Warning</h3><p>ChromeOS isn't supported for this studio.</p>",[['ok',menu]]):menu();
boot().then(start);
